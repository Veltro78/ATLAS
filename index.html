<title>Atlas</title>
<style>
:root{--bg:#fff;--soft:#f4f4f6;--illu:#f3f3f5;--ink:#0b0b0c;--ink2:#3a3a3c;--sub:#8a8a8f;--sep:rgba(0,0,0,.07);--c:#ff4d2e;--green:#16b67a;
--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.07);--shl:0 2px 6px rgba(0,0,0,.05),0 20px 44px rgba(0,0,0,.12);
--b3d:linear-gradient(165deg,#3d3d42 0%,#151517 45%,#050506 100%);--hi:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 6px rgba(0,0,0,.55);
--round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;--ease:cubic-bezier(.2,.85,.2,1);--spring:cubic-bezier(.3,1.4,.4,1);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:17px/1.32 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;padding:0 0 calc(130px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;padding:0 18px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
img{display:block;-webkit-user-drag:none}
.press{transition:transform .25s var(--spring)}.press:active{transform:scale(.95)}
.anim>*{animation:rise .6s var(--ease) both}
.anim>*:nth-child(2){animation-delay:.04s}.anim>*:nth-child(3){animation-delay:.08s}.anim>*:nth-child(4){animation-delay:.12s}.anim>*:nth-child(5){animation-delay:.16s}.anim>*:nth-child(6){animation-delay:.2s}.anim>*:nth-child(n+7){animation-delay:.24s}
.slideL>*{animation:slL .45s var(--ease) both}.slideR>*{animation:slR .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:perspective(900px) translateY(26px) rotateX(-14deg)}to{opacity:1;transform:none}}
@keyframes slL{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 0 8px}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;background:conic-gradient(from 200deg,#ff4d2e,#ff9a3d,#8b5cf6,#2f7bff,#ff4d2e);padding:2.5px}
.avatar span{width:100%;height:100%;border-radius:50%;background:var(--b3d);display:grid;place-items:center;box-shadow:var(--hi)}
.hello{font-size:17px;font-weight:800;letter-spacing:-.3px}
.hello .w{display:inline-block;transform-origin:70% 80%;animation:wave 2.2s ease 1s 2}
.date{font-size:13px;font-weight:600;color:var(--sub)}
.mode{display:flex;background:var(--soft);border-radius:99px;padding:3px;margin-left:auto;flex:none}
.mode button{height:30px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:700;color:var(--sub);transition:all .35s var(--ease)}
.mode button.on{background:var(--b3d);color:#fff;box-shadow:var(--hi),0 3px 8px rgba(0,0,0,.2)}
.dayzone{touch-action:pan-y}
.dtitle{display:flex;align-items:center;gap:12px;margin:14px 2px 12px}
.dtitle h1{font-size:44px;font-weight:850;letter-spacing:-1.2px;margin:0;line-height:1}
.dtitle .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 18%,transparent);flex:none;margin-top:6px}
.swipehint{margin-left:auto;font-size:12px;font-weight:650;color:var(--sub);display:flex;gap:4px;align-items:center}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:2px 18px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;height:38px;padding:0 16px 0 12px;border-radius:99px;background:var(--soft);font-weight:700;font-size:15px;color:var(--ink2);display:flex;align-items:center;gap:8px;transition:all .35s var(--ease)}
.day i{width:9px;height:9px;border-radius:50%;background:var(--dc)}
.day.on{background:var(--dc);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--dc) 40%,transparent)}
.day.on i{background:#fff}
h1{font-size:40px;font-weight:850;letter-spacing:-1px;margin:2px 0 0;line-height:1}
h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0;line-height:1.1}
h3{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:0}
.eyebrow{font-size:13px;font-weight:650;color:var(--sub)}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 18px) 2px 16px}
.sub{color:var(--sub);font-size:15px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 2px 12px}
.link{font-weight:700;font-size:16px;color:var(--c)}

/* status */
.status{position:relative;display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:26px;background:radial-gradient(130% 140% at 100% 0%,color-mix(in srgb,var(--c) 70%,#000) 0%,#121214 52%,#050506 100%);color:#fff;box-shadow:var(--shl);overflow:hidden;margin-bottom:16px;isolation:isolate;transition:background .5s}
.status::after{content:'';position:absolute;inset:0;border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14);pointer-events:none}
.sring{position:relative;width:64px;height:64px;flex:none}
.sring svg{position:absolute;inset:0}
.sring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--round);font-weight:800;font-size:17px}
.status .big{font-family:var(--round);font-weight:800;font-size:22px;letter-spacing:-.3px}
.status .small{font-size:13px;color:rgba(255,255,255,.62);font-weight:600;margin-top:2px}
.mini3d{position:absolute;right:0;top:0;bottom:0;width:130px;z-index:-1}
.mini3d canvas{width:100%!important;height:100%!important}
.endbtn{margin-left:auto;height:40px;padding:0 16px;border-radius:99px;background:#fff;color:#000;font-weight:750;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.35);flex:none}

/* swipe */
.sw{position:relative;margin-bottom:14px;border-radius:26px}
.sw-bg{position:absolute;inset:0;border-radius:26px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-weight:800;font-size:16px;color:#fff;background:var(--c);opacity:0;transition:opacity .2s}
.sw-bg span{display:flex;align-items:center;gap:8px}
.sw-bg svg{width:24px;height:24px}
.sw-bg .l{opacity:var(--pl,0)}.sw-bg .r{opacity:var(--pr,0)}
.sw.neg .sw-bg{background:#2c2c2e}
.sw.del .sw-bg{background:#ff3b30;justify-content:flex-end}
.swc{position:relative;touch-action:pan-y;will-change:transform}
.swc.back{transition:transform .45s var(--spring)}

/* exercise */
.ex{background:#fff;border-radius:26px;box-shadow:var(--sh);border:.5px solid rgba(0,0,0,.04);overflow:hidden;transition:box-shadow .4s var(--ease)}
.ex-img{background:var(--illu);display:block;height:200px;padding:10px;overflow:hidden;transition:height .5s var(--ease),opacity .4s,padding .5s var(--ease);position:relative}
.ex-img>img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .35s var(--ease)}
.duo{display:flex;gap:6px;width:100%;height:100%;align-items:center;justify-content:center;transition:transform .35s var(--ease)}
.duo img{flex:1;min-width:0;height:100%;object-fit:contain;mix-blend-mode:multiply}
.ex-img .badge{position:absolute;left:12px;top:12px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--c);background:#fff;border-radius:99px;padding:5px 9px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ex-body{padding:14px 16px 16px}
.ex-row{display:flex;align-items:center;gap:12px}
.ex-num{font-family:var(--round);font-weight:800;font-size:13px;color:var(--c);width:22px;flex:none}
.t1{font-weight:700;font-size:18px;letter-spacing:-.3px;line-height:1.2}
.t2{font-size:14px;color:var(--sub);margin-top:2px}
.grow{flex:1;min-width:0}
.bigchk{width:52px;height:52px;border-radius:18px;background:var(--soft);display:grid;place-items:center;color:#c4c4c9;flex:none;transition:all .35s var(--ease)}
.bigchk svg{width:24px;height:24px}
.bubbles{display:flex;gap:8px;margin-top:14px}
.bub{flex:1;min-width:0;height:48px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--round);font-weight:750;font-size:15px;color:var(--ink2);transition:background .3s var(--ease),color .3s,box-shadow .3s,transform .25s var(--spring)}
.bub:active{transform:scale(.9)}
.bub svg{width:18px;height:18px;display:none}
.bub.ok{background:var(--c);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
.bub.ok span{display:none}.bub.ok svg{display:block;animation:pop .35s var(--ease)}
.ex.done{box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ex.done .ex-img{height:0;padding:0 10px;opacity:0}
.ex.done .bubbles,.ex.done .maxrow,.ex.done .note{display:none}
.ex.done .bigchk{background:var(--c);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
.ex.done .bigchk svg{animation:pop .4s var(--ease)}
.ex.done .t1{color:var(--sub);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.18)}
.ex.done .ex-body{padding:12px 16px}
.note{font-size:14px;color:var(--ink2);background:var(--soft);border-radius:14px;padding:9px 12px;margin-top:12px}
.maxrow{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep)}
.maxrow .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--c);width:34px}
.maxrow input{width:76px;height:46px;border:0;border-radius:14px;background:var(--soft);text-align:center;font-family:var(--round);font-size:19px;font-weight:750;outline:none;-webkit-appearance:none}
.maxrow input:focus{background:#fff;box-shadow:0 0 0 2px var(--c)}
.maxrow input::placeholder{color:#b6b6bb;font-weight:650}
.maxrow .x{font-weight:700;color:var(--sub)}
.maxrow .rec{margin-left:auto;text-align:right;font-size:12px;color:var(--sub);font-weight:650;line-height:1.25}
.maxrow .rec b{display:block;color:var(--ink);font-family:var(--round);font-size:15px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;font-weight:750;font-size:17px;margin-top:10px;background:var(--soft)}
.btn.dark{background:var(--b3d);color:#fff;box-shadow:var(--hi),0 10px 24px rgba(0,0,0,.25)}
.btn.col{background:var(--c);color:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--c) 35%,transparent)}
.btn.ghost{background:none;color:var(--sub);font-weight:650;height:44px}
.btn.danger{color:#ff3b30;background:rgba(255,59,48,.08)}
.btn svg{width:20px;height:20px}

/* lists/cards */
.card{background:#fff;border-radius:24px;box-shadow:var(--sh);border:.5px solid rgba(0,0,0,.04);padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font-size:13px;font-weight:650;color:var(--sub)}
.num{font-family:var(--round);font-weight:800;font-size:26px;letter-spacing:-.5px;line-height:1.1;margin-top:4px}
.num small{font-size:14px;color:var(--sub);font-weight:700;letter-spacing:0}
.list{background:#fff;border-radius:24px;box-shadow:var(--sh);border:.5px solid rgba(0,0,0,.04);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;text-align:left;position:relative;min-height:68px;background:#fff}
.list>.row+.row::before,.list>.sw+.sw .row::before,.list>.sw+.row::before{content:'';position:absolute;top:0;left:84px;right:0;border-top:.5px solid var(--sep)}
.list .sw{margin:0;border-radius:0}.list .sw-bg{border-radius:0}
.row .t1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:8px;border-right:2px solid #c4c4c8;border-bottom:2px solid #c4c4c8;transform:rotate(-45deg);flex:none;margin-right:4px}
.thumb{width:54px;height:54px;border-radius:16px;background:var(--illu);overflow:hidden;flex:none;display:grid;place-items:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.thumb img.pair{object-position:6% 50%}
.thumb img.lib{object-fit:contain;padding:3px}
.tile{width:46px;height:46px;border-radius:15px;background:var(--b3d);box-shadow:var(--hi),0 5px 12px rgba(0,0,0,.22);color:#fff;display:grid;place-items:center;flex:none;font-family:var(--round);font-weight:800;font-size:14px}
.tile svg{width:55%;height:55%}
.ctile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 80%,#fff),var(--tc));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px color-mix(in srgb,var(--tc) 35%,transparent)}
.ctile svg{width:22px;height:22px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.empty{text-align:center;padding:30px 24px;color:var(--sub)}
.credit{font-size:12px;color:var(--sub);text-align:center;margin-top:22px;line-height:1.5}
canvas.chart{display:block;width:100%;height:200px}

/* profil */
.pro{position:relative;border-radius:30px;padding:calc(env(safe-area-inset-top) + 22px) 20px 22px;margin:0 -18px 18px;background:radial-gradient(120% 90% at 0% 0%,rgba(255,77,46,.18),transparent 60%),radial-gradient(120% 90% at 100% 10%,rgba(47,123,255,.16),transparent 60%),radial-gradient(120% 90% at 50% 100%,rgba(139,92,246,.14),transparent 60%),#fff;border-radius:0 0 34px 34px;text-align:center}
.pro .avatar{width:96px;height:96px;font-size:38px;margin:0 auto 12px;padding:4px;box-shadow:0 14px 30px rgba(0,0,0,.18)}
.pro h1{font-size:32px}
.lvl{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 12px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-weight:750;font-size:14px}
.lvl i{width:18px;height:18px;display:grid;place-items:center;color:#ff9a3d}
.xp{height:8px;border-radius:4px;background:rgba(0,0,0,.06);overflow:hidden;margin:14px auto 0;max-width:260px}
.xp i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ff4d2e,#ff9a3d,#8b5cf6);transition:width 1s var(--ease)}
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat4 .card{display:flex;gap:12px;align-items:center;padding:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:8px;background:linear-gradient(180deg,#ff9a3d,#ff4d2e);min-height:4px;transform-origin:bottom;animation:grow .8s var(--ease) both}
.bars i.zero{background:var(--soft)}
.bars span{font-size:11px;color:var(--sub);font-weight:650}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:3px;margin:6px 0 12px}
.split i{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;font-weight:650;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}.legend b{width:10px;height:10px;border-radius:3px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.2}
.bdg .m{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:conic-gradient(from 210deg,var(--a),var(--b),var(--a));box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.2),0 8px 16px color-mix(in srgb,var(--a) 35%,transparent)}
.bdg .m svg{width:26px;height:26px}
.bdg.off .m{background:var(--soft);box-shadow:none;color:#c7c7cc}.bdg.off{color:#b0b0b5}

/* library */
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:14px;background:var(--soft);padding:0 14px;margin-bottom:10px}
.search svg{width:18px;height:18px;color:var(--sub);flex:none}
.search input{border:0;background:none;outline:none;flex:1;font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 8px;padding:0 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:99px;background:var(--soft);font-size:14px;font-weight:700;color:var(--ink2);transition:all .25s var(--ease)}
.chip.on{background:var(--ink);color:#fff}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.lc{background:#fff;border-radius:20px;box-shadow:var(--sh);border:.5px solid rgba(0,0,0,.04);overflow:hidden;text-align:left;animation:rise .45s var(--ease) both}
.lc .im{height:104px;background:var(--illu);display:flex;gap:2px;padding:8px}
.lc .im img{flex:1;min-width:0;height:100%;object-fit:contain;mix-blend-mode:multiply}
.lc .tx{padding:9px 11px 11px}
.lc .tx b{display:block;font-size:14px;line-height:1.2;font-weight:700;letter-spacing:-.2px}
.lc .tx span{font-size:12px;color:var(--sub);font-weight:600}

/* tab bar */
.tabbar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:30px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.12);z-index:20;width:min(calc(100vw - 40px),360px)}
.tab{flex:1;height:52px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:650;color:#8e8e93;transition:all .35s var(--ease)}
.tab svg{width:24px;height:24px}
.tab.on{background:var(--b3d);box-shadow:var(--hi),0 4px 12px rgba(0,0,0,.25);color:#fff}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30;pointer-events:none}
#sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .3s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:30px 30px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s var(--ease);max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.12)}
#sheet.show{pointer-events:auto}#sheet.show .backdrop{opacity:1}#sheet.show .panel{transform:none}
#sheet .panel.drag{transition:none}
.grab{width:38px;height:5px;border-radius:3px;background:#dcdce0;margin:0 auto 16px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.form{background:var(--soft);border-radius:20px;overflow:hidden}
.form label{display:flex;flex-direction:column;padding:11px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--sub);gap:3px}
.form label+label{border-top:.5px solid rgba(0,0,0,.06)}
.form input{border:0;background:none;font-size:17px;font-weight:500;text-transform:none;letter-spacing:0;padding:3px 0;outline:none;color:var(--ink);-webkit-appearance:none;width:100%}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.illu{background:var(--illu);border-radius:22px;height:230px;padding:12px;margin-bottom:14px;display:block}
.illu>img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.hset{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;font-size:15px}
.hset+.hset{border-top:.5px solid var(--sep)}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-200%);opacity:0;background:var(--b3d);color:#fff;padding:12px 20px;border-radius:99px;box-shadow:var(--hi),0 10px 30px rgba(0,0,0,.25);font-weight:650;font-size:15px;transition:transform .45s cubic-bezier(.2,.9,.3,1.15),opacity .3s;z-index:40;white-space:nowrap}
#toast.show{transform:translate(-50%,0);opacity:1}
#win{position:fixed;inset:0;z-index:45;background:radial-gradient(120% 80% at 50% 20%,color-mix(in srgb,var(--c) 45%,#111),#060607 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 26px calc(30px + env(safe-area-inset-bottom));opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#win.show{opacity:1;visibility:visible}
#win .w3d{width:100%;max-width:420px;height:260px;position:relative}
#win .w3d canvas{width:100%!important;height:100%!important}
#win h2{font-size:34px;color:#fff;text-align:center;margin-top:6px}
#win .wsub{color:rgba(255,255,255,.65);text-align:center;margin:8px 0 22px;font-size:16px}
#win .wstats{display:flex;gap:10px;width:100%;max-width:420px;margin-bottom:24px}
#win .wstats div{flex:1;background:rgba(255,255,255,.1);border-radius:18px;padding:14px;text-align:center}
#win .wstats b{display:block;font-family:var(--round);font-size:24px;font-weight:800}
#win .wstats span{font-size:12px;color:rgba(255,255,255,.6);font-weight:650}
#win .btn{max-width:420px;background:#fff;color:#000}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:46}

/* ===== Onboarding ===== */
#onb{position:fixed;inset:0;z-index:60;background:#fff;overflow:hidden;display:flex;flex-direction:column;transition:opacity .6s var(--ease),transform .6s var(--ease)}
#onb.out{opacity:0;transform:scale(1.06);pointer-events:none}
#onb .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:float 9s ease-in-out infinite}
#onb .b1{width:300px;height:300px;background:#ff4d2e;left:-90px;top:-60px}
#onb .b2{width:260px;height:260px;background:#2f7bff;right:-80px;top:22%;animation-delay:-3s}
#onb .b3{width:280px;height:280px;background:#8b5cf6;left:10%;bottom:-120px;animation-delay:-6s}
#onb .b4{width:180px;height:180px;background:#16b67a;right:10%;bottom:16%;animation-delay:-4s;opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.08)}66%{transform:translate(-20px,25px) scale(.95)}}
#onb .glass{position:absolute;inset:0;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.ob-step{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 28px calc(env(safe-area-inset-bottom) + 28px);transition:opacity .5s var(--ease),transform .6s var(--ease)}
.ob-step.hide{opacity:0;transform:translateX(-40px);pointer-events:none}
.ob-step.wait{opacity:0;transform:translateX(40px);pointer-events:none}
.ob3d{width:min(86vw,380px);height:min(60vw,260px);position:relative;animation:drop 1s var(--spring) both .1s}
.ob3d canvas{width:100%!important;height:100%!important}
.ob3d .fb{position:absolute;inset:0;display:grid;place-items:center}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.7)}to{opacity:1;transform:none}}
.ob-logo{font-size:64px;font-weight:900;letter-spacing:-3px;line-height:1;display:flex;margin-top:6px}
.ob-logo span{display:inline-block;animation:letter .7s var(--spring) both;background:linear-gradient(160deg,#0b0b0c 30%,#5a5a60);-webkit-background-clip:text;background-clip:text;color:transparent}
.ob-logo span.dot{background:none;color:#ff4d2e;-webkit-text-fill-color:#ff4d2e}
@keyframes letter{from{opacity:0;transform:translateY(40px) rotateX(-80deg)}to{opacity:1;transform:none}}
.ob-tag{font-size:19px;font-weight:650;color:var(--ink2);text-align:center;margin-top:12px;line-height:1.35;animation:fadeup .7s var(--ease) both .9s}
.ob-tag b{background:linear-gradient(90deg,#ff4d2e,#ff9a3d,#8b5cf6,#2f7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ob-pills{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.ob-pills span{display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;background:rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.07);font-size:13px;font-weight:700;color:var(--ink2);animation:fadeup .6s var(--ease) both}
.ob-pills i{width:8px;height:8px;border-radius:50%}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ob-bottom{position:absolute;left:28px;right:28px;bottom:calc(env(safe-area-inset-bottom) + 28px);max-width:420px;margin:0 auto}
.ob-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:60px;border-radius:20px;background:var(--b3d);color:#fff;font-size:18px;font-weight:750;box-shadow:var(--hi),0 14px 30px rgba(0,0,0,.25);animation:fadeup .7s var(--ease) both 1.4s;transition:transform .25s var(--spring),opacity .3s}
.ob-btn:active{transform:scale(.96)}
.ob-btn:disabled{opacity:.35}
.ob-btn svg{width:20px;height:20px}
.ob-small{text-align:center;font-size:13px;color:var(--sub);margin-top:12px;animation:fadeup .7s var(--ease) both 1.6s}
.ob-q{font-size:34px;font-weight:850;letter-spacing:-1px;text-align:center;line-height:1.1}
.ob-wave{font-size:56px;animation:wave 2s ease .3s 2;display:inline-block;transform-origin:70% 80%;margin-bottom:10px}
.ob-in{width:100%;max-width:420px;height:68px;margin-top:28px;border:0;border-radius:22px;background:rgba(255,255,255,.9);box-shadow:0 0 0 2px transparent,0 10px 30px rgba(0,0,0,.08);text-align:center;font-size:26px;font-weight:750;letter-spacing:-.4px;outline:none;transition:box-shadow .3s;-webkit-appearance:none}
.ob-in:focus{box-shadow:0 0 0 2.5px #0b0b0c,0 10px 30px rgba(0,0,0,.1)}
.ob-in::placeholder{color:#c0c0c5;font-weight:650}
.ob-goal{display:flex;gap:8px;margin-top:22px}
.ob-goal button{width:52px;height:52px;border-radius:17px;background:rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.07);font-family:var(--round);font-weight:800;font-size:19px;transition:all .3s var(--spring)}
.ob-goal button.on{background:var(--b3d);color:#fff;box-shadow:var(--hi),0 8px 18px rgba(0,0,0,.25);transform:translateY(-3px)}
.ob-hi{font-size:46px;font-weight:900;letter-spacing:-1.6px;text-align:center;line-height:1.05}
.ob-hi span{background:linear-gradient(90deg,#ff4d2e,#ff9a3d,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<div id="onb" hidden><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="glass"></div>
 <section class="ob-step" id="ob1">
  <div class="ob3d" id="ob3d"><div class="fb"><span class="tile" style="width:120px;height:120px;border-radius:38px" id="obfb"></span></div></div>

 </section>

 </section>
</div>

 <button class="tab" data-act="tab:plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3.5" width="16" height="17" rx="3.5"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg>Programme</button>

/* ===== Utilitaires ===== */
function parseScheme(s){const out=[];const re=/(\d+)\s*[x×*]\s*([^,;\/]+)/gi;let m;while((m=re.exec(s||''))){const n=Math.min(+m[1],10),t=m[2].trim();for(let i=0;i<n;i++)out.push(t)}return out.length?out:['—']}
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const fmtN=n=>(Math.round(n*10)/10).toLocaleString('fr-FR');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function fmtDur(ms){const m=Math.max(0,Math.floor(ms/60000));return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`}
const fmtDate=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
function weekStart(t){const d=new Date(t),k=(d.getDay()+6)%7;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-k).getTime()}
function streak(){const ws=new Set(S.sessions.map(s=>weekStart(s.start)));let w=weekStart(Date.now()),n=0;if(!ws.has(w))w=weekStart(w-864e5);while(ws.has(w)){n++;w=weekStart(w-864e5)}return n}
const estMin=d=>Math.round(d.ex.reduce((a,e)=>a+parseScheme(e.scheme).length*165,0)/60/5)*5;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2000)}
function haptic(n){try{navigator.vibrate&&navigator.vibrate(n||10)}catch(e){}}
function greet(){const h=new Date().getHours();return h<5?'Bonne nuit':h<18?'Bonjour':'Bonsoir'}
function setColor(){document.documentElement.style.setProperty('--c',col(UI.tab==='plan'?UI.planDay:UI.day))}
/* images : photo perso > Dylan/intégrée > bibliothèque */
function media(e,cls){
  if(S.img[e.id])return `<img src="${S.img[e.id]}" alt="" class="${cls||''}">`;
  if(e.lib){const[a,b]=libUrls(e.lib);return cls==='thumb'?`<img src="${b}" alt="" class="lib" loading="lazy">`:`<div class="duo"><img src="${a}" alt="" loading="lazy"><img src="${b}" alt="" loading="lazy"></div>`}
  if(IMG[e.k])return `<img src="${IMG[e.k]}" alt="" class="${cls==='thumb'&&PAIR.includes(e.k)?'pair':''}">`;
  return '';
}
const hasMedia=e=>!!(S.img[e.id]||e.lib||IMG[e.k]);
function thumb(e){return hasMedia(e)?`<span class="thumb">${media(e,'thumb')}</span>`:`<span class="thumb"><span class="tile" style="width:54px;height:54px;border-radius:16px">${I.dumb}</span></span>`}
function ringSvg(v,max,size,sw){const r=(size-sw)/2,c=2*Math.PI*r,p=Math.min(1,max?v/max:0);return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="${sw}"/><circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#fff" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .7s var(--ease)"/></svg>`}
function hist(k){const out=[];S.sessions.forEach(s=>Object.values(s.ex).forEach(e=>{if(e.k===k&&e.w)out.push({t:s.start,w:e.w,r:e.r||0})}));return out}
function record(k){const h=hist(k);return h.length?h.reduce((a,b)=>b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a):null}
const lastMax=k=>{const h=hist(k);return h.length?h[h.length-1]:null};
const fmtMax=m=>m?`${fmtN(m.w)} kg${m.r?` × ${m.r}`:''}`:'—';

/* ===== Séance ===== */
function curEx(e){if(!S.cur.ex[e.id])S.cur.ex[e.id]={d:parseScheme(e.scheme).map(()=>false),w:'',r:''};return S.cur.ex[e.id]}
function ensureCur(){if(!S.cur||S.cur.day!==UI.day)S.cur={day:UI.day,start:Date.now(),ex:{}};return S.cur}
const curOn=()=>S.cur&&S.cur.day===UI.day;
function dayStats(){const d=S.program[UI.day];let doneEx=0,sets=0,tot=0;d.ex.forEach(e=>{tot+=parseScheme(e.scheme).length;const c=curOn()&&S.cur.ex[e.id];if(c){sets+=c.d.filter(Boolean).length;if(c.d.every(Boolean))doneEx++}});return{doneEx,nEx:d.ex.length,sets,tot}}
let WL=null;async function wake(){try{if(S.cur&&'wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}

/* ===== Vue : Séance ===== */
function statusHTML(){
  const st=dayStats(),d=S.program[UI.day],on=curOn()&&st.sets>0;
  return `<div class="status" id="status"><div class="mini3d" id="mini3d"></div>
   <div class="sring">${ringSvg(st.doneEx,st.nEx,64,7)}<b>${st.doneEx}/${st.nEx}</b></div>
   <div><div class="big" id="sbig">${on?`${st.sets}/${st.tot} séries`:`≈ ${fmtDur(estMin(d)*60000)}`}</div><div class="small">${on?`En cours · <span id="elapsed">${fmtDur(Date.now()-S.cur.start)}</span>`:`${st.nEx} exercices · ${st.tot} séries`}</div></div>
   ${on?`<button class="endbtn press" data-act="finish">Terminer</button>`:''}</div>`;
}
function exHTML(e,i){
  const c=curOn()?S.cur.ex[e.id]:null,targets=parseScheme(e.scheme),d=c?c.d:targets.map(()=>false),all=!!c&&d.every(Boolean);
  const last=lastMax(e.k),rec=record(e.k);
  let h=`<div class="sw" data-sw="ex" data-id="${e.id}"><div class="sw-bg"><span class="l">${I.check} Fait</span><span class="r">Annuler ${I.undo}</span></div><div class="swc"><section class="ex ${all?'done':''}" id="ex-${e.id}">
   <div class="ex-img" data-act="zoom:${e.id}">${hasMedia(e)?media(e):`<div style="height:100%;display:grid;place-items:center"><span class="tile" style="width:70px;height:70px;border-radius:22px">${I.dumb}</span></div>`}${e.tbc?'<span class="badge">Volume à confirmer</span>':''}</div>
   <div class="ex-body"><div class="ex-row"><span class="ex-num">${String(i+1).padStart(2,'0')}</span><div class="grow"><div class="t1">${esc(e.name)}</div><div class="t2">${esc(e.scheme)}</div></div>
   <button class="bigchk" data-act="all:${e.id}" aria-label="Exercice fait">${I.check}</button></div>
   <div class="bubbles">${targets.map((t,j)=>`<button class="bub ${d[j]?'ok':''}" data-act="set:${e.id}:${j}"><span>${esc(t)}</span>${I.check}</button>`).join('')}</div>`;
  if(e.note)h+=`<div class="note">${esc(e.note)}</div>`;
  if(S.mode==='expert'&&e.kind==='w')h+=`<div class="maxrow"><span class="lbl">Max</span><input inputmode="decimal" data-id="${e.id}" data-f="w" value="${esc(c?c.w:'')}" placeholder="${last?String(last.w).replace('.',','):'kg'}"><span class="x">×</span><input inputmode="numeric" data-id="${e.id}" data-f="r" value="${esc(c?c.r:'')}" placeholder="${last&&last.r?last.r:'reps'}" style="width:64px"><span class="rec">Record<b>${fmtMax(rec)}</b></span></div>`;
  return h+`</div></section></div></div>`;
}
function todayView(){
  const d=S.program[UI.day];
  let h=`<div class="dayzone" id="dayzone"><div class="top"><button class="avatar press" data-act="tab:me"><span>${esc((S.name||'?')[0].toUpperCase())}</span></button><div><div class="hello">${greet()}${S.name?`, ${esc(S.name)}`:''} <span class="w">👋</span></div><div class="date">${cap(fmtDate(Date.now()))}</div></div>
   <div class="mode"><button class="${S.mode==='simple'?'on':''}" data-act="mode:simple">Simple</button><button class="${S.mode==='expert'?'on':''}" data-act="mode:expert">Expert</button></div></div>
   <div class="dtitle"><span class="dot"></span><h1>${esc(d.name)}</h1>${S.hint?`<span class="swipehint">${I.swipe.replace('<svg','<svg style="width:14px;height:14px"')}glisse</span>`:''}</div></div>
   <div class="days">${S.program.map((x,i)=>`<button class="day press ${i===UI.day?'on':''}" style="--dc:${col(i)}" data-act="day:${i}"><i></i>${esc(x.name)}</button>`).join('')}</div>`;
  h+=statusHTML();
  d.ex.forEach((e,i)=>h+=exHTML(e,i));
  if(!d.ex.length)h+=`<div class="card empty">Cette séance est vide.<br><button class="link" data-act="tab:plan" style="margin-top:10px">Ajouter des exercices</button></div>`;
  h+=`<div id="endzone">${endZone()}</div>`;
  return h;
}
const endZone=()=>dayStats().sets?`<button class="btn col press" data-act="finish">${I.check}Terminer la séance</button><button class="btn ghost" data-act="reset">Tout décocher</button>`:'';
function refreshCard(e){
  const el=document.getElementById('ex-'+e.id);if(!el)return;const c=S.cur.ex[e.id];
  el.querySelectorAll('.bub').forEach((b,j)=>b.classList.toggle('ok',!!c.d[j]));
  const all=c.d.every(Boolean);if(all!==el.classList.contains('done')){el.classList.toggle('done',all);if(all){haptic([15,40,15]);setTimeout(()=>{const nx=el.closest('.sw').nextElementSibling;if(nx&&nx.classList.contains('sw')&&!nx.querySelector('.ex.done'))nx.scrollIntoView({behavior:'smooth',block:'center'})},420)}}
}
function refreshStatus(){
  const st=dayStats(),old=$('#status');if(!old)return;
  const was=!!old.querySelector('.endbtn'),now=st.sets>0;
  if(was!==now){old.outerHTML=statusHTML();mount3D()}
  else{const r=(64-7)/2,c=2*Math.PI*r;old.querySelector('.arc').setAttribute('stroke-dashoffset',c*(1-Math.min(1,st.doneEx/st.nEx)));old.querySelector('.sring b').textContent=`${st.doneEx}/${st.nEx}`;if(now)$('#sbig').textContent=`${st.sets}/${st.tot} séries`}
  $('#endzone').innerHTML=endZone();
  if(st.doneEx===st.nEx&&st.nEx)setTimeout(()=>{if(dayStats().doneEx===st.nEx)finish(true)},800);
}
function toggleSet(id,j,mode){ // mode: undefined (une série) | 'all' (bascule) | 'on' | 'off'
  const d=S.program[UI.day],e=d.ex.find(x=>x.id===id);if(!e)return;
  if(S.cur&&S.cur.day!==UI.day&&Object.values(S.cur.ex).some(x=>x.d.some(Boolean))&&!confirm(`Une séance ${S.program[S.cur.day]?.name||''} est en cours. La remplacer ?`))return;
  ensureCur();const c=curEx(e);
  if(mode){const v=mode==='on'?true:mode==='off'?false:!c.d.every(Boolean);c.d=c.d.map(()=>v);haptic(v?14:8)}
  else{c.d[j]=!c.d[j];haptic(10)}
  if(S.hint&&c.d.some(Boolean)){S.hint=false;const h=$('.swipehint');h&&h.remove()}
  save();refreshCard(e);refreshStatus();wake();
}
function finish(auto){
  const cur=S.cur;if(!cur)return;const d=S.program[cur.day];if(!d){S.cur=null;save();return}
  const ex={};let sets=0,tot=0,exDone=0;
  d.ex.forEach(e=>{const c=cur.ex[e.id],n=parseScheme(e.scheme).length;tot+=n;if(!c)return;const k=c.d.filter(Boolean).length;if(!k&&!num(c.w))return;sets+=k;if(k===c.d.length)exDone++;ex[e.id]={k:e.k,lib:e.lib||null,name:e.name,sets:k,total:c.d.length,w:num(c.w),r:num(c.r)}});
  if(!sets){S.cur=null;save();render();return}
  if(!auto&&sets<tot&&!confirm(`${sets}/${tot} séries cochées. Terminer la séance ?`))return;
  const s={id:Date.now().toString(36),day:cur.day,dayName:d.name,start:cur.start,end:Date.now(),ex};
  const prs=Object.values(ex).filter(e=>{if(!e.w)return false;let best=0;S.sessions.forEach(b=>Object.values(b.ex).forEach(x=>{if(x.k===e.k&&x.w>best)best=x.w}));return best>0&&e.w>best}).length;
  S.sessions.push(s);S.next=(cur.day+1)%S.program.length;S.cur=null;save();
  $('#wtitle').textContent=exDone===d.ex.length?'Séance validée 🔥':'Séance enregistrée';
  $('#wsub').textContent=`${d.name} · ${cap(fmtDate(s.start))}`;
  $('#wstats').innerHTML=`<div><b>${exDone}/${d.ex.length}</b><span>exercices</span></div><div><b>${fmtDur(s.end-s.start)}</b><span>durée</span></div><div><b>${prs||sets}</b><span>${prs?'records':'séries'}</span></div>`;
  $('#win').classList.add('show');haptic([20,60,20,60,40]);confetti();mountWin3D();UI.day=S.next;
}

  const acc=getComputedStyle(document.documentElement).getPropertyValue('--c').trim()||'#ff4d2e',pad={l:10,r:12,t:30,b:24};let mn=Math.min(...pts),mx=Math.max(...pts);if(mn===mx){mn-=1;mx+=1}const rg=mx-mn;mn-=rg*.2;mx+=rg*.12;
  const X=i=>pts.length===1?W/2:pad.l+i*(W-pad.l-pad.r)/(pts.length-1),Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(H-pad.t-pad.b);

  const g=x.createLinearGradient(0,pad.t,0,H-pad.b);g.addColorStop(0,acc+'40');g.addColorStop(1,acc+'00');path();x.lineTo(X(pts.length-1),H-pad.b);x.lineTo(X(0),H-pad.b);x.closePath();x.fillStyle=g;x.fill();
  path();x.strokeStyle=acc;x.lineWidth=3;x.lineCap='round';x.stroke();pts.forEach((v,i)=>{const l=i===pts.length-1;x.beginPath();x.arc(X(i),Y(v),l?6:3,0,7);x.fillStyle=l?acc:'#fff';x.fill();x.lineWidth=l?3:2;x.strokeStyle=l?'#fff':acc;x.stroke()});
  x.font='800 13px ui-rounded,-apple-system,sans-serif';x.fillStyle='#0b0b0c';x.textAlign=X(pts.length-1)>W-40?'right':'center';x.fillText(fmtN(pts[pts.length-1])+' kg',Math.min(X(pts.length-1),W-2),Y(pts[pts.length-1])-14)}

function sheet(html){const s=$('#sheet');s.innerHTML=`<div class="backdrop" data-act="closesheet"></div><div class="panel"><div class="grab"></div>${html}</div>`;requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('show')))}
function closeSheet(){const s=$('#sheet');s.classList.remove('show');const p=s.querySelector('.panel');if(p)p.style.transform='';document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}
function zoomSheet(id){const e=S.program[UI.day].ex.find(x=>x.id===id);if(!e)return;sheet(`<div class="illu" style="height:300px">${media(e)}</div><h2>${esc(e.name)}</h2><div class="sub" style="margin-top:4px">${esc(e.scheme)}${record(e.k)?` · record ${fmtMax(record(e.k))}`:''}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}`)}

/* ===== Rendu ===== */
function render(){
  setColor();const v=UI.tab,app=$('#app');app.innerHTML=v==='today'?todayView():v==='plan'?planView():meView();
  app.className=UI.slide||(UI.anim?'anim':'');UI.anim=false;UI.slide='';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.act==='tab:'+v));
  mount3D();
}
setInterval(()=>{const el=$('#elapsed');if(el&&curOn())el.textContent=fmtDur(Date.now()-S.cur.start)},15000);

/* ===== Gestes : swipe cartes, swipe jours, feuille ===== */
let G=null;
document.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('input,.bub,.bigchk,.mode,.days,.seg,.chips'))return;
  const sw=ev.target.closest('.sw'),dz=ev.target.closest('#dayzone,#status'),pn=ev.target.closest('.panel'),grab=pn&&(ev.target.closest('.grab')||pn.scrollTop<=0&&ev.target.closest('.sheet-h,.illu,.grab'));
  G={x:ev.clientX,y:ev.clientY,sw,dz,pn:grab?pn:null,dx:0,dy:0,lock:null};
  const im=ev.target.closest('.ex-img');if(im){const r=im.getBoundingClientRect(),a=(ev.clientX-r.left)/r.width-.5,b=(ev.clientY-r.top)/r.height-.5,t=im.firstElementChild;if(t)t.style.transform=`perspective(600px) rotateY(${a*14}deg) rotateX(${-b*14}deg) scale(1.04)`}
},{passive:true});
document.addEventListener('pointermove',ev=>{
  if(!G)return;G.dx=ev.clientX-G.x;G.dy=ev.clientY-G.y;
  if(!G.lock&&(Math.abs(G.dx)>8||Math.abs(G.dy)>8))G.lock=Math.abs(G.dx)>Math.abs(G.dy)*1.2?'h':'v';
  if(G.lock==='h'&&G.sw){const c=G.sw.querySelector('.swc'),del=G.sw.classList.contains('del');let dx=G.dx;if(del&&dx>0)dx=dx*.15;c.classList.remove('back');c.style.transform=`translateX(${dx}px)`;
    const p=Math.min(1,Math.abs(dx)/100);G.sw.querySelector('.sw-bg').style.opacity=p>.05?1:0;G.sw.style.setProperty('--pl',dx>0?p:0);G.sw.style.setProperty('--pr',dx<0?p:0);G.sw.classList.toggle('neg',dx<0&&!del);
    if(Math.abs(dx)>100&&!G.buzz){haptic(8);G.buzz=1}if(Math.abs(dx)<100)G.buzz=0}
  if(G.pn&&G.lock==='v'&&G.dy>0){G.pn.classList.add('drag');G.pn.style.transform=`translateY(${G.dy}px)`}
},{passive:true});
function endG(){
  document.querySelectorAll('.ex-img>*:first-child').forEach(i=>i.style.transform='');
  if(!G)return;const g=G;G=null;if(g.lock==='h'){window.__sw=1;setTimeout(()=>window.__sw=0,60)}
  if(g.sw&&g.lock==='h'){const c=g.sw.querySelector('.swc');c.classList.add('back');c.style.transform='';setTimeout(()=>{g.sw.querySelector('.sw-bg').style.opacity=0},250);
    if(g.sw.dataset.sw==='ex'){if(g.dx>100)toggleSet(g.sw.dataset.id,0,'on');else if(g.dx<-100)toggleSet(g.sw.dataset.id,0,'off')}
    else if(g.sw.dataset.sw==='row'&&g.dx<-110){const di=+g.sw.dataset.di,ei=+g.sw.dataset.ei;c.style.transform='translateX(-110%)';haptic(15);setTimeout(()=>{S.program[di].ex.splice(ei,1);save();render();toast('Exercice supprimé')},250)}
    return}
  if(g.dz&&g.lock==='h'&&Math.abs(g.dx)>60&&UI.tab==='today'){g.dx<0?switchDay(UI.day+1,'slideL'):switchDay(UI.day-1,'slideR');return}
  if(g.pn){g.pn.classList.remove('drag');if(g.dy>110)closeSheet();else g.pn.style.transform=''}
}
document.addEventListener('pointerup',endG);document.addEventListener('pointercancel',endG);
/* empêche le "clic" après un swipe */
document.addEventListener('click',ev=>{if(ev.target.closest('.sw')&&window.__sw){ev.stopPropagation();ev.preventDefault()}},true);

/* ===== Clics ===== */
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&t.dataset.id){const ex=S.program[UI.day].ex.find(x=>x.id===t.dataset.id);if(!ex)return;ensureCur();curEx(ex)[t.dataset.f]=t.value;save()}});
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const p=el.dataset.act.split(':'),a=p[0];
  switch(a){
  case 'tab':if(UI.tab!==p[1])UI.anim=true;UI.tab=p[1];if(p[1]==='plan')UI.planDay=UI.day;render();scrollTo(0,0);break;
  case 'mode':S.mode=p[1];save();render();break;
  case 'day':switchDay(+p[1],+p[1]>UI.day?'slideL':'slideR');break;
  case 'set':toggleSet(p[1],+p[2]);break;
  case 'all':toggleSet(p[1],0,'all');break;
  case 'zoom':zoomSheet(p[1]);break;
  case 'finish':finish(false);break;
  case 'reset':if(confirm('Tout décocher pour cette séance ?')){S.cur=null;save();render()}break;
  case 'winclose':$('#win').classList.remove('show');UI.anim=true;render();scrollTo(0,0);break;
  case 'liftk':liftSheet(p[1]);break;
  case 'sess':sessSheet(p[1]);break;
  case 'delsess':if(confirm('Supprimer cette séance ?')){S.sessions=S.sessions.filter(s=>s.id!==p[1]);save();closeSheet();render()}break;
  case 'pday':UI.planDay=+p[1];setColor();render();break;
  case 'addday':{const n=prompt('Nom de la nouvelle séance','Full body');if(n&&n.trim()){S.program.push({name:n.trim(),ex:[]});UI.planDay=S.program.length-1;save();render()}break}
  case 'dayopts':dayOpts(+p[1]);break;
  case 'saveday':{const n=$('#d-name').value.trim();if(n){S.program[+p[1]].name=n;save()}closeSheet();render();break}
  case 'mvday':{const i=+p[1],j=i+(+p[2]);if(j<0||j>=S.program.length)break;[S.program[i],S.program[j]]=[S.program[j],S.program[i]];S.cur=null;UI.planDay=j;UI.day=Math.min(UI.day,S.program.length-1);save();closeSheet();render();break}
  case 'delday':if(confirm(`Supprimer la séance ${S.program[+p[1]].name} ?`)){S.program.splice(+p[1],1);S.cur=null;UI.planDay=0;UI.day=0;S.next=0;save();closeSheet();render()}break;
  case 'edit':editSheet(+p[1],+p[2]);break;
  case 'saveex':saveEx(+p[1],+p[2]);break;
  case 'mvex':{const arr=S.program[+p[1]].ex,i=+p[2],j=i+(+p[3]);if(j>=0&&j<arr.length){[arr[i],arr[j]]=[arr[j],arr[i]];save();render();editSheet(+p[1],j)}break}
  case 'lib':libSheet(+p[1],null);break;
  case 'libimg':libSheet(+p[1],+p[2]);break;
  case 'lg':UI.lib.g=p[1];document.querySelectorAll('#lg .chip').forEach(c=>c.classList.toggle('on',c.dataset.act===el.dataset.act));libRes();break;
  case 'le':UI.lib.e=p[1];document.querySelectorAll('#le .chip').forEach(c=>c.classList.toggle('on',c.dataset.act===el.dataset.act));libRes();break;
  case 'pickd':{const x=DYLAN.find(d=>d.k===p[1]);x&&pick(x);break}
  case 'pickl':{const r=LIB.find(x=>x[0]===p[1]);r&&pick({k:'lib-'+r[0],lib:r[0],name:r[1],kind:r[3]==='Poids du corps'&&r[2]==='Abdos'?'c':'w'});break}
  case 'pickimg':UI.imgTarget=p[1];$('#imgfile').click();break;
  case 'rmimg':delete S.img[p[1]];save();render();editSheet(+p[2],+p[3]);break;
  case 'editname':sheet(`<div class="sheet-h"><h2>Profil</h2></div><div class="form"><label>Prénom<input id="s-name"></label><label>Objectif séances / semaine<input id="s-goal" inputmode="numeric"></label></div><button class="btn col press" data-act="savename" style="margin-top:14px">Enregistrer</button>`);$('#s-name').value=S.name||'';$('#s-goal').value=S.goal;break;
  case 'savename':S.name=$('#s-name').value.trim();S.goal=Math.max(1,Math.min(7,parseInt($('#s-goal').value)||4));save();closeSheet();render();break;
  case 'ob':obStep(+p[1]);break;
  case 'replayonb':[1,2,3].forEach(i=>{const s=$('#ob'+i);s.classList.toggle('hide',false);s.classList.toggle('wait',i>1)});$('#onb').classList.remove('out');OB3=null;showOnb();break;
  case 'obg':obGoal(+p[1]);break;
  case 'closesheet':closeSheet();break;
  case 'export':exportData();break;
  case 'import':$('#file').click();break;
  case 'resetprog':if(confirm('Remettre le programme de Dylan ? Tes modifs seront perdues (pas l’historique).')){S.program=withIds(clone(DEF));S.cur=null;S.next=0;UI.day=0;UI.planDay=0;save();render();toast('Programme remis')}break;
  }
});
$('#imgfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';const id=UI.imgTarget;if(!f||!id)return;const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
   const prev=S.img[id];S.img[id]=c.toDataURL('image/jpeg',.78);if(!save()){if(prev)S.img[id]=prev;else delete S.img[id];return alert('Plus assez de place.')}closeSheet();render();toast('Photo ajoutée')};im.src=url});
async function exportData(){const name=`atlas-${new Date().toISOString().slice(0,10)}.json`,blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.program||!Array.isArray(d.sessions))throw 0;if(confirm(`Restaurer (${d.sessions.length} séances) ?`)){S=d;S.img=S.img||{};save();closeSheet();render();toast('Restauré')}}catch(err){alert('Fichier invalide')}})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ===== Confettis ===== */
function confetti(){const c=$('#confetti'),x=c.getContext('2d'),dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#ffffff',getComputedStyle(document.documentElement).getPropertyValue('--c').trim(),'#ff9a3d','#8b5cf6','#2f7bff','#16b67a'],P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:3+Math.random()*4,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function step(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.r*2));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(++f<170)requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight)})()}

/* ===== Haltère 3D ===== */
let R3=null,RW=null;
function makeScene(dist){const T=THREE,r=new T.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.outputEncoding=T.sRGBEncoding;r.toneMapping=T.ACESFilmicToneMapping;
  const sc=new T.Scene(),cam=new T.PerspectiveCamera(30,1,.1,50);cam.position.set(0,.1,dist);
  const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#fff');gr.addColorStop(.42,'#8c8c92');gr.addColorStop(.55,'#1a1a1d');gr.addColorStop(1,'#000');g.fillStyle=gr;g.fillRect(0,0,512,256);g.fillStyle='#fff';g.fillRect(70,30,130,34);g.fillRect(320,22,110,44);
  const tex=new T.CanvasTexture(c);tex.mapping=T.EquirectangularReflectionMapping;tex.encoding=T.sRGBEncoding;sc.environment=new T.PMREMGenerator(r).fromEquirectangular(tex).texture;
  sc.add(new T.AmbientLight(0xffffff,.25));const k=new T.DirectionalLight(0xffffff,1.6);k.position.set(-3,4,5);sc.add(k);const rim=new T.PointLight(0xffffff,3,10);rim.position.set(3,1,-2);sc.add(rim);
  const chrome=new T.MeshStandardMaterial({color:0xe8e8ec,metalness:1,roughness:.14}),rubber=new T.MeshStandardMaterial({color:0x131315,metalness:.15,roughness:.42}),accent=new T.MeshStandardMaterial({color:0xff4d2e,metalness:.3,roughness:.35});
  const db=new T.Group(),rz=m=>{m.rotation.z=Math.PI/2;return m};db.add(rz(new T.Mesh(new T.CylinderGeometry(.11,.11,1.3,40),chrome)));
  [-1,1].forEach(s=>{const a=rz(new T.Mesh(new T.CylinderGeometry(.19,.19,.1,40),chrome));a.position.x=s*.69;db.add(a);const b=rz(new T.Mesh(new T.CylinderGeometry(.52,.52,.5,6),rubber));b.position.x=s*1.03;db.add(b);const d=rz(new T.Mesh(new T.CylinderGeometry(.42,.42,.02,6),accent));d.position.x=s*1.03;d.scale.set(1.26,1,1.26);db.add(d);const e=rz(new T.Mesh(new T.CylinderGeometry(.24,.24,.05,40),chrome));e.position.x=s*1.29;db.add(e)});
  db.rotation.set(.35,-.6,.2);sc.add(db);const el=r.domElement,fit=()=>{const p=el.parentElement;if(!p)return;const w=p.clientWidth,h=p.clientHeight;if(!w||!h)return;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()};
  return{r,sc,cam,db,el,fit,accent,rim}}
function tint(R){if(!R)return;const c=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--c').trim()||'#ff4d2e');R.accent.color.copy(c);R.rim.color.copy(c)}
function boot3D(){if(R3||!window.THREE)return;try{R3=makeScene(5.6);const t0=performance.now();
  (function loop(n){requestAnimationFrame(loop);if(!R3.el.isConnected||document.hidden)return;R3.db.rotation.y+=.012;R3.db.position.y=Math.sin((n-t0)/650)*.07;R3.r.render(R3.sc,R3.cam)})(t0);mount3D()}catch(e){R3=null}}
function mount3D(){const s=$('#mini3d');if(s&&R3){if(R3.el.parentElement!==s)s.appendChild(R3.el);R3.fit();tint(R3)}}
function mountWin3D(){if(!window.THREE)return;try{if(!RW){RW=makeScene(5);const t0=performance.now();(function loop(n){requestAnimationFrame(loop);if(!$('#win').classList.contains('show'))return;const t=(n-t0)/1000;RW.db.rotation.y+=.02;RW.db.rotation.x=.35+Math.sin(t)*.15;RW.db.position.y=Math.sin(t*1.6)*.1;RW.r.render(RW.sc,RW.cam)})(t0)}
  tint(RW);const s=$('#win3d'),fb=$('#wfb');if(fb)fb.remove();if(RW.el.parentElement!==s)s.appendChild(RW.el);RW.fit();RW.db.scale.setScalar(.01);const t0=performance.now();(function grow(n){const k=Math.min(1,(n-t0)/700);RW.db.scale.setScalar(.01+(1-Math.pow(1-k,3))*.99);if(k<1)requestAnimationFrame(grow)})(t0)}catch(e){}}


/* ===== Onboarding ===== */
let OB3=null;
function showOnb(){const o=$('#onb');o.hidden=false;$('#obfb').innerHTML=I.dumb;
  $('#oblogo').innerHTML=[...'Atlas'].map((c,i)=>`<span style="animation-delay:${.35+i*.07}s">${c}</span>`).join('')+`<span class="dot" style="animation-delay:.75s">.</span>`;
  $('#obname').value=S.name||'';obGoal(S.goal||4);obCheck();
  $('#obname').addEventListener('input',obCheck);$('#obname').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#obnext').disabled)obStep(3)});
  mountOb3D()}
function obCheck(){$('#obnext').disabled=!$('#obname').value.trim()}
function obGoal(n){S.goal=n;document.querySelectorAll('#obgoal button').forEach(b=>b.classList.toggle('on',b.dataset.act==='obg:'+n));haptic(6)}
function obStep(n){
  [1,2,3].forEach(i=>{const s=$('#ob'+i);s.classList.toggle('hide',i<n);s.classList.toggle('wait',i>n)});haptic(10);
  if(n===2)setTimeout(()=>$('#obname').focus(),450);
  if(n===3){S.name=$('#obname').value.trim().slice(0,20);S.onboarded=true;save();$('#obname').blur();
    $('#obhi').innerHTML=`Salut<br><span>${esc(S.name)}</span> 💪`;render();
    setTimeout(()=>{$('#onb').classList.add('out');setTimeout(()=>{$('#onb').hidden=true;UI.anim=true;render()},600)},1700)}
}
function mountOb3D(){if(!window.THREE||OB3||$('#onb').hidden)return;try{OB3=makeScene(5.2);const s=$('#ob3d');s.innerHTML='';s.appendChild(OB3.el);OB3.fit();const t0=performance.now();
  let spin=.06;(function loop(n){if($('#onb').hidden)return;requestAnimationFrame(loop);const t=(n-t0)/1000;spin=Math.max(.012,spin*.985);OB3.db.rotation.y+=spin;OB3.db.rotation.x=.35+Math.sin(t*.8)*.12;OB3.db.position.y=Math.sin(t*1.5)*.08;
    const c=['#ff4d2e','#2f7bff','#8b5cf6','#16b67a'][Math.floor(t/1.6)%4];OB3.accent.color.lerp(new THREE.Color(c),.06);OB3.rim.color.lerp(new THREE.Color(c),.06);OB3.r.render(OB3.sc,OB3.cam)})(t0)}catch(e){OB3=null}}

$('#wfb .tile').innerHTML=I.dumb;
render();if(S.cur)wake();
if(!S.onboarded)showOnb();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" async onload="boot3D();mountOb3D()"></script>
